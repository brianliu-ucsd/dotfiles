# Enable mouse support (click to select panes, resize, and scroll)
set -g mouse on

# Fix line delay when pressing Esc in Neovim/Vim
set -s escape-time 0

# Increase scrollback buffer limit (default is 2000 lines)
set -g history-limit 50000

# Set terminal color support (crucial for truecolor / themes in Neovim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Start window and pane indexing at 1 instead of 0 (matches keyboard layout)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split panes using | and - (easier to remember than % and ")
# Opens new panes in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# Open new windows in the current working directory
bind c new-window -c "#{pane_current_path}"

# Use Vi keybindings in Copy Mode (Prefix + [)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set-option -g status-position top

# Catppuccin
set -g @catppuccin_window_status_style "rounded"

# Window formatting
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

run '~/.config/tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default

# Configure Status Left and Right
set -g status-left-length 100
set -g status-right-length 100

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
